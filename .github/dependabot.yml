# Weekly dependency updates (CI-6). Go updates that raise the go directive
# above the minimum (NFR-2) fail the Go 1.25 test job by design.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
