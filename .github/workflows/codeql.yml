# CodeQL static analysis for Go (CI-2). Actions are pinned to commit SHAs
# (CI-4; docs/DECISIONS.md section 1.7).
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    # Code scanning needs GitHub Advanced Security on private repositories,
    # so this runs only on a public repository or when the repository
    # variable ENABLE_CODE_SCANNING is "true" (docs/DECISIONS.md D-9.5).
    # Otherwise the job is skipped, which satisfies a required check.
    # Comparing visibility to 'public' is false when it is missing.
    if: github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
          build-mode: manual
      - name: Build
        run: go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go
