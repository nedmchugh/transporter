# Dependency review on pull requests (CI-2). It also enforces the LIC-3
# license allowlist for newly added dependencies.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Dependency review needs GitHub Advanced Security on private repositories,
    # so this runs only on a public repository or when the repository
    # variable ENABLE_CODE_SCANNING is "true" (docs/DECISIONS.md D-9.5).
    # Otherwise the job is skipped, which satisfies a required check.
    # Comparing visibility to 'public' is false when it is missing.
    if: github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, ISC, Apache-2.0, MPL-2.0, 0BSD, Unlicense, CC0-1.0
