# CI gates for pull requests and main (CI-1). Third-party actions are pinned
# to commit SHAs resolved from their repositories (CI-4; see
# docs/DECISIONS.md section 1.7). Job names are the required status checks
# listed in docs/branch-protection.md; keep the two in sync.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Without this, the toolchain line in go.mod would silently replace the Go
  # version under test (docs/DECISIONS.md D-1.1).
  GOTOOLCHAIN: local
  # The minimum supported Go: 1.26 (docs/DECISIONS.md D-1.3; os.Root needs
  # 1.25, but 1.25 is out of upstream support).
  GO_MIN: "1.26.x"
  GO_LATEST: "1.27.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: gofmt and go vet
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
          go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Test with race detector, shuffle and coverage threshold
        shell: bash
        run: make cover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage.out
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: End-to-end tests
        shell: bash
        run: make e2e

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: Run each fuzz target briefly
        run: make fuzz FUZZTIME=30s

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: govulncheck
        run: make vuln

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: SPDX headers, dependency allowlist, THIRD_PARTY_LICENSES
        run: make license-check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: Cross-compile linux/darwin/windows x amd64/arm64
        run: make build-cross

  docker-build:
    # Keeps the Docker build (Dockerfile, scripts/docker-build.sh) working.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build every platform in Docker
        run: scripts/docker-build.sh
      - name: Check the artifacts
        run: |
          cd dist/docker
          sha256sum -c SHA256SUMS
          test "$(ls transporter-* | wc -l)" -eq 6
          ./transporter-linux-amd64 --version

  install:
    # Keeps scripts/install.sh working: it installs /usr/local/bin/transporter
    # for real (the runners have passwordless sudo) and must use root for the
    # copy only. Docker is not available on the macOS runners, so macOS runs
    # the local build only.
    name: install (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, mode: docker }
          - { os: ubuntu-latest, mode: local }
          - { os: macos-latest, mode: local }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.mode == 'local'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: Refuse to run under sudo
        run: |
          if sudo -E env "PATH=$PATH" scripts/install.sh --${{ matrix.mode }}; then
            echo "install.sh ran under sudo"; exit 1
          fi
          test ! -e /usr/local/bin/transporter
          test ! -e bin && test ! -e dist
      - name: Install
        run: scripts/install.sh --${{ matrix.mode }}
      - name: Check the installed binary
        run: |
          set -x
          /usr/local/bin/transporter --version
          test -n "$(find /usr/local/bin/transporter -user root)"
          test -x /usr/local/bin/transporter
          # The build ran as the runner user: no root-owned build output.
          test -z "$(find bin dist -user root 2>/dev/null)"
      - name: Install again over the existing binary
        run: scripts/install.sh --${{ matrix.mode }}

  mod-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: go mod tidy -diff and go mod verify
        run: make tidy-check

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - name: Requirements-to-tests table (TEST-1)
        run: go run ./tools/reqcheck .
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: |
            **/*.md
            #obsolete
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --include-fragments --exclude-path obsolete '**/*.md'
          fail: true
