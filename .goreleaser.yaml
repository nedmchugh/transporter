# GoReleaser configuration (CI-3). Run by .github/workflows/release.yml.
version: 2

project_name: transporter

before:
  hooks:
    - go mod verify

builds:
  - id: transporter
    main: ./cmd/transporter
    binary: transporter
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nedmchugh/transporter/internal/meta.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # LIC-6: license texts ship in every archive.
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

release:
  draft: true
  replace_existing_draft: true

# Release notes come from CHANGELOG.md (scripts/release-notes.sh, passed
# with --release-notes by release.yml), not from the commit list. Do not
# set "disable: true": the changelog step is what reads the
# --release-notes file, so disabling it publishes empty notes. Given the
# file, the step uses it and does not build the commit list.
changelog:
  use: git
